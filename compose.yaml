services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: openrenaper:latest
    container_name: openrenaper-api
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 40s
    ports:
      - "${OPENRENAPER_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - FORWARDED_ALLOW_IPS=${OPENRENAPER_PROXIES_CONFIABLES:-127.0.0.1}
      - OPENRENAPER_RATE_LIMIT_HABILITADO=${OPENRENAPER_RATE_LIMIT_HABILITADO:-true}
      - OPENRENAPER_RATE_LIMIT_POR_IP=${OPENRENAPER_RATE_LIMIT_POR_IP:-15}
      - OPENRENAPER_RATE_LIMIT_TOTAL=${OPENRENAPER_RATE_LIMIT_TOTAL:-30}
      - OPENRENAPER_RATE_LIMIT_VENTANA_SEGUNDOS=${OPENRENAPER_RATE_LIMIT_VENTANA_SEGUNDOS:-60}
      - OPENRENAPER_RATE_LIMIT_MAX_EN_CURSO=${OPENRENAPER_RATE_LIMIT_MAX_EN_CURSO:-4}
      - OPENRENAPER_LOG_SOLICITUDES=${OPENRENAPER_LOG_SOLICITUDES:-true}
      - OPENRENAPER_LOG_HEALTH=${OPENRENAPER_LOG_HEALTH:-false}
      - OPENRENAPER_TIEMPO_LIMITE_PROVEEDOR=${OPENRENAPER_TIEMPO_LIMITE_PROVEEDOR:-45.0}
      - OPENRENAPER_PAG_WEB2_HABILITADO=${OPENRENAPER_PAG_WEB2_HABILITADO:-true}
      - OPENRENAPER_PAG_WEB2_MODO=${OPENRENAPER_PAG_WEB2_MODO:-navegador}
      - OPENRENAPER_PAG_WEB2_URL=${OPENRENAPER_PAG_WEB2_URL:-}
      - OPENRENAPER_PAG_WEB2_MAX_CONCURRENTES=${OPENRENAPER_PAG_WEB2_MAX_CONCURRENTES:-2}
      - OPENRENAPER_PAG_WEB2_INTERVALO_MINIMO=${OPENRENAPER_PAG_WEB2_INTERVALO_MINIMO:-2.0}
      - OPENRENAPER_PAG_WEB2_INTENTOS=${OPENRENAPER_PAG_WEB2_INTENTOS:-3}
      - OPENRENAPER_PAG_WEB2_TIEMPO_SOLICITUD=${OPENRENAPER_PAG_WEB2_TIEMPO_SOLICITUD:-30.0}
      - OPENRENAPER_PAG_WEB2_TIEMPO_TOTAL=${OPENRENAPER_PAG_WEB2_TIEMPO_TOTAL:-40.0}
      - OPENRENAPER_PAG_WEB2_ESPERA_BASE=${OPENRENAPER_PAG_WEB2_ESPERA_BASE:-0.5}
      - OPENRENAPER_PAG_WEB1_HABILITADO=${OPENRENAPER_PAG_WEB1_HABILITADO:-true}
      - OPENRENAPER_PAG_WEB1_URL=${OPENRENAPER_PAG_WEB1_URL:-}
      - OPENRENAPER_PAG_WEB1_MAX_CONCURRENTES=${OPENRENAPER_PAG_WEB1_MAX_CONCURRENTES:-2}
      - OPENRENAPER_PAG_WEB1_INTERVALO_MINIMO=${OPENRENAPER_PAG_WEB1_INTERVALO_MINIMO:-2.0}
      - OPENRENAPER_PAG_WEB1_INTENTOS=${OPENRENAPER_PAG_WEB1_INTENTOS:-2}
      - OPENRENAPER_PAG_WEB1_TIEMPO_SOLICITUD=${OPENRENAPER_PAG_WEB1_TIEMPO_SOLICITUD:-30.0}
      - OPENRENAPER_PAG_WEB1_TIEMPO_TOTAL=${OPENRENAPER_PAG_WEB1_TIEMPO_TOTAL:-40.0}
      - OPENRENAPER_PAG_WEB1_ESPERA_BASE=${OPENRENAPER_PAG_WEB1_ESPERA_BASE:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${OPENRENAPER_CPU_LIMIT:-2.0}"
          memory: "${OPENRENAPER_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "${OPENRENAPER_CPU_RESERVATION:-0.5}"
          memory: "${OPENRENAPER_MEMORY_RESERVATION:-512M}"
    shm_size: "256m"
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
