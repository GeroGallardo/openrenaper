[project]
name = "openrenaper"
version = "0.1.0"
description = "API académica para consultar datos personales públicos por DNI o CUIT/CUIL"
authors = [
    { name = "Ibañez Matias Agustin" },
    { name = "Vergara Atilio" },
    { name = "Gutierrez Andrés" },
    { name = "Gallardo Piorno Gerónimo" },
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "playwright>=1.49,<2",
    "scalar-fastapi>=1.9.1,<2",
    "scrapling>=0.5,<0.6",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Las comprobaciones contra fuentes reales se ejecutan a mano: `pytest -m real`.
addopts = "-m 'not real'"
markers = ["real: consulta fuentes reales; excluida de CI y de la ejecución habitual"]
